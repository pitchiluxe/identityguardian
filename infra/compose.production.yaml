# Packaged stack (Phase 20). Local acceptance only: nothing here is deployed by this project.
#   python -m scripts.package_secrets      # one-time: random secrets into .local/secrets/
#   OIDC_ISSUER_URL=https://idp.example/realms/x docker compose -f infra/compose.production.yaml up -d --build
# Requires an external HTTPS OIDC provider (U4); no IdP is shipped for production.
name: identityguardian-prod

x-app: &app
  image: identityguardian:local
  build: { context: .., dockerfile: infra/docker/Dockerfile }
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  restart: unless-stopped

services:
  postgres:
    image: postgres:18.3
    environment:
      POSTGRES_DB: identityguardian
      POSTGRES_USER: guardian_migrator
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: ["pgdata:/var/lib/postgresql"]
    networks: [backend]  # internal only: no published port
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U guardian_migrator -d identityguardian"]
      interval: 5s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  migrate:
    <<: *app
    restart: "no"
    command: ["python", "scripts/manage.py", "migrate"]
    secrets: [migration_database_url, runtime_password, worker_password]
    networks: [backend]
    depends_on: { postgres: { condition: service_healthy } }

  api:
    <<: *app
    environment:
      DEVELOPMENT: "false"
      SECURE_COOKIES: "true"
      APP_ORIGIN: https://${IG_DOMAIN:-localhost}
      OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?external HTTPS OIDC issuer required}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-identityguardian}
      AI_ENABLED: ${AI_ENABLED:-false}  # no model server is packaged
      FORWARDED_ALLOW_IPS: 172.30.0.10  # the proxy only
    secrets: [database_url, secret_master_key, audit_signing_key]
    networks: [backend, edge]
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    <<: *app
    command: ["python", "-m", "apps.worker.main"]
    environment:
      WORKER_HEARTBEAT_FILE: /tmp/worker-heartbeat
    secrets: [worker_database_url, secret_master_key]
    networks: [backend]
    depends_on: { migrate: { condition: service_completed_successfully } }
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(time.time()-os.path.getmtime('/tmp/worker-heartbeat')>60)"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 30s

  proxy:
    image: caddy:2.10-alpine
    environment:
      IG_DOMAIN: ${IG_DOMAIN:-localhost}
    ports: ["${IG_BIND:-127.0.0.1}:8443:443"]
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    networks: { edge: { ipv4_address: 172.30.0.10 } }
    depends_on: [api]
    restart: unless-stopped

networks:
  backend: { internal: true }
  edge:
    ipam: { config: [{ subnet: 172.30.0.0/24 }] }

volumes:
  pgdata:
  caddy_data:

secrets:
  postgres_password: { file: ../.local/secrets/postgres_password }
  migration_database_url: { file: ../.local/secrets/migration_database_url }
  database_url: { file: ../.local/secrets/database_url }
  worker_database_url: { file: ../.local/secrets/worker_database_url }
  runtime_password: { file: ../.local/secrets/runtime_password }
  worker_password: { file: ../.local/secrets/worker_password }
  secret_master_key: { file: ../.local/secrets/secret_master_key }
  audit_signing_key: { file: ../.local/secrets/audit_signing_key }
