[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL"]
# Tests are tenant-isolated; run in parallel. Use -n 0 to debug serially.
addopts = "-n 4 -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "S"]

[tool.ruff.lint.per-file-ignores]
# Tests assert and use synthetic credentials by design.
"tests/**" = ["S101", "S105", "S106", "S311", "S603", "S607", "S608"]
# Local setup runs fixed PostgreSQL binaries with argument lists (no shell).
"scripts/native_postgres.py" = ["S603"]
