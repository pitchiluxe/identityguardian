[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requires local PostgreSQL"]
# Tests are tenant-isolated; run in parallel. Use -n 0 to debug serially.
addopts = "-n 4 -p no:cacheprovider"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
